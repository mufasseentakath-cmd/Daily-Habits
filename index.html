*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#20204a 0,#0b0d12 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}

button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer;background:var(--accent);color:#fff}

.add{width:100%;background:transparent;border:1px dashed #414653;color:#b5bbc7;margin-top:7px}.add:hover{border-color:var(--accent);color:#fff}

function key(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){localStorage.setItem("lifeTrackerData",JSON.stringify(data));localStorage.setItem("lifeTrackerChecks",JSON.stringify(checks));localStorage.setItem("lifeTrackerSnapshots",JSON.stringify(snapshots))}
function allIds(){let a=[];data.forEach((s,si)=>s.items.forEach((_,ii)=>a.push(si+"-"+ii)));return a}
function completedCount(day){let c=checks[day]||{};return allIds().filter(id=>c[id]).length}
function snapshotToday(){let k=key();snapshots[k]={sections:data.map((s,si)=>({name:s.name,items:s.items.map((x,ii)=>({name:x,done:!!(checks[k]?.[si+"-"+ii])}))}))};save()}
function render(){
 snapshotToday();
 document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const q=quotes[Math.floor(Date.now()/86400000)%quotes.length];document.getElementById("quote").textContent="“"+q[0]+"”";document.getElementById("quoteBy").textContent=q[1];
 const wrap=document.getElementById("sections");wrap.innerHTML="";
 data.forEach((s,si)=>{
  const sec=document.createElement("div");sec.className="section";
  sec.innerHTML=`<div class="sectionHead"><h2>${esc(s.name)}</h2><div class="sectionBtns"><button class="mini" onclick="renameSection(${si})">Edit</button><button class="mini" onclick="deleteSection(${si})">Delete</button></div></div>`;
  s.items.forEach((item,ii)=>{
   const id=si+"-"+ii,checked=!!checks[key()]?.[id];
   const row=document.createElement("div");row.className="task"+(checked?" done":"");
   row.innerHTML=`<input type="checkbox" ${checked?"checked":""}><label>${esc(item)}</label><button class="iconBtn" title="Edit habit">✎</button><button class="iconBtn" title="Delete habit">×</button>`;
   row.querySelector("input").onchange=e=>toggle(id,e.target.checked);
   row.querySelectorAll(".iconBtn")[0].onclick=()=>renameItem(si,ii);
   row.querySelectorAll(".iconBtn")[1].onclick=()=>deleteItem(si,ii);
   sec.appendChild(row);
  });
  const add=document.createElement("button");add.className="add";add.textContent="+ Add habit";add.onclick=()=>openAdd(si);sec.appendChild(add);
  wrap.appendChild(sec);
 });
 update();
}
function toggle(id,val){checks[key()]??={};checks[key()][id]=val;save();render()}
function update(){
 let total=allIds().length,done=completedCount(key()),p=total?Math.round(done/total*100):0;
 document.getElementById("percent").textContent=p+"%";document.getElementById("fill").style.width=p+"%";document.getElementById("count").textContent=`${done} / ${total} completed`;
 document.getElementById("done").textContent=done;document.getElementById("remaining").textContent=total-done;document.getElementById("streak").textContent=getStreak();document.getElementById("best").textContent=getBest();
}
function getStreak(){let d=new Date(),n=0;while(true){if(completedCount(key(d))<allIds().length)break;n++;d.setDate(d.getDate()-1)}return n}
function getBest(){let ks=Object.keys(snapshots).sort(),best=0,n=0;ks.forEach(k=>{let s=snapshots[k],total=s.sections.reduce((a,x)=>a+x.items.length,0),done=s.sections.reduce((a,x)=>a+x.items.filter(i=>i.done).length,0);if(total&&done===total)n++;else n=0;best=Math.max(best,n)});return best}
function openAdd(si=null){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Add ${si===null?"a section":"a habit"}</h2><input id="newText" type="text" placeholder="${si===null?"Section name":"Habit name"}><div class="modalActions"><button onclick="submitAdd(${si===null?"null":si})">Add</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`);setTimeout(()=>document.getElementById("newText").focus(),50)}
function submitAdd(si){let v=document.getElementById("newText").value.trim();if(!v)return;if(si===null)data.push({name:v,items:[]});else data[si].items.push(v);save();closeModal();render()}
function renameItem(si,ii){showPrompt("Edit habit",data[si].items[ii],v=>{if(v){data[si].items[ii]=v;save();render();}})}
function renameSection(si){showPrompt("Edit section",data[si].name,v=>{if(v){data[si].name=v;save();render();}})}
function showPrompt(title,value,fn){showModal(`<button class="close" onclick="closeModal()">×</button><h2>${title}</h2><input id="newText" type="text" value="${esc(value)}"><div class="modalActions"><button onclick="let v=document.getElementById('newText').value.trim();closeModal();(${fn.toString()})(v)">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`)}
function deleteItem(si,ii){if(confirm("Delete this habit?")){data[si].items.splice(ii,1);save();render()}}
function deleteSection(si){if(confirm("Delete this whole section and its habits?")){data.splice(si,1);save();render()}}
function resetToday(){if(confirm("Reset all of today's checkboxes?")){delete checks[key()];save();render()}}
function openHistory(){
 let days=[];let d=new Date();d.setDate(1);
 for(let i=0;i<35;i++){let x=new Date(d);x.setDate(i+1);if(x.getMonth()!==d.getMonth())break;days.push(x)}
 let cells=days.map(x=>{let k=key(x),total=allIds().length,done=completedCount(k);return `<div class="histDay ${total&&done===total?"good":""} ${k===key()?"today":""}" onclick="showDay('${k}')">${x.toLocaleDateString(undefined,{weekday:"short"})}<strong>${x.getDate()}</strong>${done}/${total}</div>`}).join("");
 showModal(`<button class="close" onclick="closeModal()">×</button><h2>📅 Progress History</h2><div class="sub">Your completed days and daily details are saved in this browser.</div><div class="historyGrid">${cells}</div><div id="historyDetail" class="historyDetail"><div class="empty">Tap a day to see its progress.</div></div>`);
}
function showDay(k){
 let s=snapshots[k];if(!s){document.getElementById("historyDetail").innerHTML='<div class="empty">No saved snapshot for this day.</div>';return}
 let total=0,done=0,rows="";
 s.sections.forEach(sec=>sec.items.forEach(it=>{total++;if(it.done)done++;rows+=`<div class="detailRow"><span>${esc(sec.name)} · ${esc(it.name)}</span><span>${it.done?"✓ Done":"— Not done"}</span></div>`}));
 document.getElementById("historyDetail").innerHTML=`<b>${new Date(k+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})} — ${Math.round(done/total*100)}%</b>${rows}`;
}
function showModal(content){document.getElementById("modalBox").innerHTML=content;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
